name: servia_painel
description: "ServPilot - painel web do gestor (cadastros, planejamento, financeiro)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Endereços sem "#" (painel.../assinatura): links de volta do Mercado Pago e F5 (guia 51).
  flutter_web_plugins:
    sdk: flutter
  servia_comum:
    path: ../comum
  # 2.15+: links assinados das fotos (createSignedUrlsResult).
  supabase_flutter: ^2.15.0
  go_router: ^14.8.0
  # PDF das etiquetas QR e impressão/download no navegador.
  pdf: ^3.11.0
  printing: ^5.13.0
  # Escolher arquivo e abrir aba no navegador (relato por áudio de teste).
  web: ^1.1.0
  # Ler a planilha .xlsx do PMOC no navegador (guia 55): já vêm com o pdf.
  archive: any
  xml: any
  # QR Code do Pix na tela (guia 73): já vem com o pdf.
  qr: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
