name: servia_painel
description: "ServPilot - painel web do gestor (cadastros, planejamento, financeiro)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  servia_comum:
    path: ../comum
  # 2.15+: links assinados das fotos (createSignedUrlsResult).
  supabase_flutter: ^2.15.0
  go_router: ^14.8.0
  # PDF das etiquetas QR e impressão/download no navegador.
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
